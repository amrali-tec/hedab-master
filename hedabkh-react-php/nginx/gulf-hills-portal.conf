# ==============================================================================
# GULF HILLS CONTRACTING — NGINX PRODUCTION REVERSE PROXY & CACHING CONFIGURATION
# Primary Canonical Domain: https://hedabkh.com.sa
# WWW Subdomain:            https://www.hedabkh.com.sa -> 301 Redirect to Primary
# Node.js Upstream:         127.0.0.1:3000 (Single-Instance Fork Mode)
# ==============================================================================

# Define Microcache Zone (10MB metadata, 500MB max cache size, inactive 60m)
proxy_cache_path /var/cache/nginx/gulf_hills_cache levels=1:2 keys_zone=GULF_HILLS_CACHE:10m max_size=500m inactive=60m use_temp_path=off;

# ------------------------------------------------------------------------------
# 1. HTTP -> HTTPS REDIRECT (PORT 80)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name hedabkh.com.sa www.hedabkh.com.sa;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://hedabkh.com.sa$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. WWW SUBDOMAIN -> PRIMARY CANONICAL REDIRECT (PORT 443)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hedabkh.com.sa;

    ssl_certificate /etc/letsencrypt/live/hedabkh.com.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hedabkh.com.sa/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://hedabkh.com.sa$request_uri;
}

# ------------------------------------------------------------------------------
# 3. PRIMARY CANONICAL HOST (https://hedabkh.com.sa)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hedabkh.com.sa;

    # SSL TLS Configuration
    ssl_certificate /etc/letsencrypt/live/hedabkh.com.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hedabkh.com.sa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Sovereign Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Max Upload Payload (Aligned with 10MB upload limit in server)
    client_max_body_size 12M;

    # Compression
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # --------------------------------------------------------------------------
    # Cache Control Rules
    # --------------------------------------------------------------------------
    set $skip_cache 0;

    # Never cache POST/PUT/DELETE/PATCH mutations
    if ($request_method != GET) {
        set $skip_cache 1;
    }

    # Never cache admin studio routes
    if ($request_uri ~* "^/ar/admin/|^/en/admin/|^/admin/") {
        set $skip_cache 1;
    }

    # Never cache protected CMS API endpoints
    if ($request_uri ~* "^/api/admin/|^/api/cms/|^/api/ready/") {
        set $skip_cache 1;
    }

    # Never cache requests containing active admin session cookie or Authorization header
    if ($http_cookie ~* "gulf_hills_session") {
        set $skip_cache 1;
    }
    if ($http_authorization != "") {
        set $skip_cache 1;
    }

    # --------------------------------------------------------------------------
    # Public & Static Asset Locations
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # --------------------------------------------------------------------------
    # General Reverse Proxy with Public Microcache
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Microcaching Directives
        proxy_cache GULF_HILLS_CACHE;
        proxy_cache_bypass $skip_cache;
        proxy_no_cache $skip_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;

        add_header X-Cache-Status $upstream_cache_status always;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
